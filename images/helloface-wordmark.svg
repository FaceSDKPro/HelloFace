<svg xmlns="http://www.w3.org/2000/svg" width="170" height="40" viewBox="0 0 170 40" role="img" aria-label="HelloFace">
  <style>
    .hello { fill: #132b2a; }
    .face { fill: #188768; }
    @media (prefers-color-scheme: dark) {
      .hello { fill: #ffffff; }
      .face { fill: #7ce8c6; }
    }
  </style>
  <text x="1" y="39" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-2.2"><tspan class="hello">Hello</tspan><tspan class="face">Face</tspan></text>
</svg>
